version: 2
updates:
  # Third-party front-end libraries (see package.json). Dependabot opens PRs for
  # security and version updates; run `npm run build` and commit the regenerated
  # files under js/ before merging. Treat major bumps (jquery 4.x, mermaid 11.x,
  # devbridge-autocomplete 2.x) as manual, tested reviews.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"

  # Keep the GitHub Actions used by CI patched too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
